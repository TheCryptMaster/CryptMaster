[build-system]
requires = ["setuptools>=69.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CryptMaster"
version = "2.0.0"
description = "Client for a Crypt Master vault server"
readme = "README.md"
authors = [{ name = "Huth S0lo", email = "john@themorphium.io" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["python", "password", "security", "key server"]
requires-python = ">=3.9"

dependencies = [
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/TheCryptMaster/CryptMaster"
"Vault server" = "https://github.com/TheCryptMaster/CryptMasterServer"
